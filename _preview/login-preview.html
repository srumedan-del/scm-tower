<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCM Tower - Login Preview</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #2783DE;
    --blue-dark: #1e6bb8;
    --surface: #F9F8F7;
    --text: #2C2C2B;
    --muted: #6B7280;
    --border: rgba(0,0,0,0.08);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 6px rgba(0,0,0,0.07);
    --focus-ring: 0 0 0 3px rgba(39,131,222,0.25);
    --transition-smooth: 250ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    background: var(--surface);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
  }
  .login-container {
    width: 100%;
    max-width: 380px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .brand-logo {
    width: 44px; height: 44px;
    background: var(--blue);
    border-radius: 12px;
    display: grid;
    place-items: center;
    color: white;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 4px 12px rgba(39,131,222,0.3);
  }
  .brand-text h1 {
    font-size: 16px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
  }
  .brand-text p {
    font-size: 12px;
    color: var(--muted);
  }
  .input-group {
    position: relative;
    margin-bottom: 1rem;
  }
  .input-group svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: #9CA3AF;
    width: 16px; height: 16px;
  }
  .input-field {
    width: 100%;
    padding: 10px 14px 10px 40px;
    border: 0;
    border-bottom: 1px solid rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.45);
    border-radius: 8px;
    font-size: 14px;
    color: var(--text);
    box-shadow: var(--shadow-sm);
    transition: box-shadow var(--transition-smooth), border-color var(--transition-smooth), transform var(--transition-smooth);
  }
  .input-field::placeholder { color: var(--muted); opacity: 0.6; }
  .input-field:focus {
    outline: none;
    box-shadow: var(--focus-ring);
    border-color: var(--blue);
  }
  .submit-btn {
    width: 100%;
    padding: 11px;
    background: var(--blue);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow-md);
    transition: background-color 200ms ease, box-shadow var(--transition-smooth), transform var(--transition-smooth);
  }
  .submit-btn:hover {
    background: var(--blue-dark);
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(39,131,222,0.3);
  }
  .submit-btn:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
  }
  .label { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 0.25rem; display: block; }
</style>
</head>
<body>
<div class="login-container">
  <div class="brand">
    <div class="brand-logo">SC</div>
    <div class="brand-text">
      <h1>SCM Medan</h1>
      <p>Control Center</p>
    </div>
  </div>
  
  <label class="label">Email</label>
  <div class="input-group">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207" /></svg>
    <input type="email" class="input-field" placeholder="nama@email.com">
  </div>
  
  <label class="label">Password</label>
  <div class="input-group">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" /></svg>
    <input type="password" class="input-field" placeholder="••••••••">
  </div>
  
  <button class="submit-btn">Masuk</button>
</div>
</body>
</html>
